<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LabSoft 2026 — Pathology Laboratory Information System (by RANDOM_GTV)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600;1,800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f3f2f2;
    --surface: #ffffff;
    --surface-alt: #eae7e7;
    --text: #201e1d;
    --text-muted: #605d5d;
    --text-dim: #7d7979;
    --border: #201e1d;
    --border-light: #d7d3d3;
    --border-subtle: #eae7e7;
    --accent-red: #ec3013;
    --accent-red-hover: #dd2b0f;
    --accent-blue: #1A5FB4;
    --accent-blue-soft: #E8EFFA;
    --accent-green: #16703F;
    --accent-green-soft: #EAF5EE;
    --accent-amber: #8A5A00;
    --accent-amber-soft: #FDF5E3;
    --brand-navy: #0A3668;
    --brand-blue: #0E4D92;
    --brand-cyan: #00A3E0;
    --brand-ice: #F0F6FC;
  }

  body.dark {
    --bg: #151413;
    --surface: #1e1c1b;
    --surface-alt: #282625;
    --text: #f3f2f2;
    --text-muted: #a6a2a2;
    --text-dim: #7d7979;
    --border: #f3f2f2;
    --border-light: #3d3a39;
    --border-subtle: #282625;
    --accent-red: #ff563c;
    --accent-red-hover: #ff705a;
    --accent-blue: #62A0EA;
    --accent-blue-soft: #1C2E46;
    --accent-green: #57E389;
    --accent-green-soft: #123820;
    --accent-amber: #F6D32D;
    --accent-amber-soft: #382D08;
    --brand-navy: #072242;
    --brand-blue: #48CAE4;
    --brand-cyan: #48CAE4;
    --brand-ice: #102438;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Archivo", system-ui, -apple-system, BlinkMacSystemFont, Arial, sans-serif;
    font-size: 13.5px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }

  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; border-radius: 0; }

  .app-container {
    max-width: 1440px;
    min-height: 100vh;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    border-left: 1px solid var(--border-light);
    border-right: 1px solid var(--border-light);
  }

  /* 01. Header Bar */
  .top-header {
    height: 44px;
    background: #201e1d;
    color: #f3f2f2;
    display: flex;
    align-items: center;
    padding: 0 18px;
    gap: 16px;
    border-bottom: 2px solid #000;
  }
  .brand-title {
    font-size: 14px;
    font-weight: 800;
    letter-spacing: .16em;
    color: #f3f2f2;
  }
  .lab-subtitle {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .1em;
    color: #9b9797;
  }
  .author-badge-top {
    background: #ec3013;
    color: #ffffff;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: .08em;
    padding: 2px 8px;
    text-transform: uppercase;
    cursor: pointer;
  }
  .top-right {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 16px;
    font-size: 11px;
  }
  .live-dot {
    width: 7px;
    height: 7px;
    background: #16703F;
    display: inline-block;
  }

  /* 02. Navigation Tabs Bar */
  .nav-tabs-bar {
    height: 38px;
    background: var(--bg);
    border-bottom: 2px solid var(--border);
    display: flex;
    align-items: stretch;
    padding: 0 18px;
    gap: 2px;
    overflow-x: auto;
  }
  .nav-tab-item {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 14px;
    background: none;
    border: none;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-muted);
    transition: all .1s ease;
    white-space: nowrap;
  }
  .nav-tab-item.active {
    background: var(--surface);
    color: var(--text);
    font-weight: 800;
    box-shadow: inset 0 -3px 0 0 var(--accent-red);
  }
  .nav-tab-item:hover:not(.active) { background: var(--surface-alt); }

  /* Main Workspace Area */
  .workspace-main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  /* 03. Job Banner / Status Region */
  .job-banner {
    background: var(--surface);
    border-bottom: 2px solid var(--border);
    display: flex;
    align-items: center;
    padding: 10px 18px;
    gap: 20px;
  }
  .stat-block { display: flex; flex-direction: column; }
  .stat-label {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 2px;
  }
  .stat-value-lg {
    font-size: 18px;
    font-weight: 800;
    letter-spacing: -.01em;
    line-height: 1.2;
    font-variant-numeric: tabular-nums;
  }
  .v-divider { width: 1px; height: 34px; background: var(--border-light); }

  /* Buttons */
  .btn-m {
    height: 32px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0 14px;
    font-size: 12px;
    font-weight: 700;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    transition: all .1s ease;
  }
  .btn-m:hover { background: var(--surface-alt); }
  .btn-m.primary {
    background: var(--accent-red);
    border-color: var(--accent-red);
    color: #ffffff;
  }
  .btn-m.primary:hover { background: var(--accent-red-hover); }
  .btn-m.primary:disabled { opacity: .45; cursor: not-allowed; }
  .btn-m.dark-btn { background: #201e1d; color: #fff; border-color: #201e1d; }
  .btn-m.dark-btn:hover { background: #333; }

  /* Split Panes Layout */
  .job-split-pane {
    flex: 1;
    display: flex;
    min-height: 0;
  }
  .left-col-sidebar {
    width: 410px;
    border-right: 2px solid var(--border);
    display: flex;
    flex-direction: column;
    background: var(--surface);
    min-height: 0;
  }
  .center-col-results {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    background: var(--surface);
    border-right: 1px solid var(--border-light);
  }
  .right-col-cheatsheet {
    width: 280px;
    background: var(--bg);
    border-left: 1px solid var(--border-light);
    display: flex;
    flex-direction: column;
  }

  /* Form Elements */
  .field-box { margin-bottom: 10px; }
  .field-input {
    width: 100%;
    height: 34px;
    border: 1px solid var(--border-light);
    background: var(--surface);
    padding: 0 10px;
    font-size: 13px;
    font-weight: 600;
    border-radius: 0;
  }
  .field-input:focus {
    border: 2px solid var(--border);
    outline: none;
    padding: 0 9px;
  }
  .field-input.req-missing {
    border-color: var(--accent-amber);
    background: var(--accent-amber-soft);
    color: var(--accent-amber);
  }

  /* Net Payable Dark Band */
  .net-payable-band {
    height: 84px;
    background: #201e1d;
    color: #f3f2f2;
    display: flex;
    align-items: center;
    padding: 0 20px;
    gap: 32px;
  }
  .np-large {
    font-size: 32px;
    font-weight: 800;
    letter-spacing: -.025em;
    color: #f3f2f2;
    line-height: 1.1;
    font-variant-numeric: tabular-nums;
  }

  /* Results Table */
  .results-header-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 148px 78px 132px 84px 34px;
    gap: 12px;
    align-items: center;
    height: 30px;
    padding: 0 18px;
    border-bottom: 2px solid var(--border);
    background: var(--surface-alt);
  }
  .results-header-cell {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--text-muted);
  }
  .results-data-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 148px 78px 132px 84px 34px;
    gap: 12px;
    align-items: center;
    min-height: 50px;
    padding: 6px 18px;
    border-bottom: 1px solid var(--border-subtle);
  }
  .res-input-box {
    height: 38px;
    border: 1px solid var(--border-light);
    background: var(--surface);
    display: flex;
    align-items: center;
    padding: 0 10px;
  }
  .res-input-box input {
    width: 100%;
    border: none;
    background: transparent;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -.02em;
    font-variant-numeric: tabular-nums;
    outline: none;
  }
  .res-input-box.calc-box {
    background: var(--surface-alt);
    border-style: dashed;
  }
  .res-input-box.calc-box input {
    font-style: italic;
    color: var(--text-muted);
  }

  /* Flags */
  .flag-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    height: 22px;
    padding: 0 8px;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: .06em;
    text-transform: uppercase;
  }
  .flag-H { background: #FDECEB; border: 1px solid #C1121F; color: #C1121F; }
  .flag-L { background: #E8EFFA; border: 1px solid #1A5FB4; color: #1A5FB4; }
  .flag-N { background: #EAF5EE; border: 1px solid #16703F; color: #16703F; }

  /* Status Badges */
  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    height: 24px;
    padding: 0 9px;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: .05em;
    text-transform: uppercase;
  }
  .sp-draft { background: var(--surface-alt); border: 1px solid var(--border-light); color: var(--text-muted); }
  .sp-prog { background: #E8EFFA; border: 1px solid #1A5FB4; color: #1A5FB4; }
  .sp-ready { background: #EAF5EE; border: 1px solid #16703F; color: #16703F; }
  .sp-sent { background: #F0F6FC; border: 1px solid #0E4D92; color: #0E4D92; }

  /* Panels Grid */
  .panel-tag-btn {
    height: 34px;
    display: inline-flex;
    align-items: center;
    padding: 0 10px;
    border: 1px solid var(--border-light);
    background: var(--surface);
    font-size: 11.5px;
    font-weight: 600;
    cursor: pointer;
    transition: all .1s ease;
  }
  .panel-tag-btn:hover { background: var(--surface-alt); border-color: var(--border); }

  /* Status Bar */
  .bottom-statusbar {
    height: 32px;
    background: var(--bg);
    border-top: 2px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 18px;
    font-size: 11.5px;
    color: var(--text-muted);
    gap: 18px;
  }
  .bottom-statusbar b { color: var(--text); }
  .bottom-statusbar .right-side {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 16px;
  }

  /* Modal Sheets */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(10, 20, 30, .75);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 1000;
  }
  .modal-overlay.open { display: flex; }
  .modal-dialog-box {
    background: var(--surface);
    border: 2px solid var(--border);
    box-shadow: 0 20px 60px rgba(0,0,0,.35);
    max-width: 980px;
    width: 100%;
    max-height: 94vh;
    display: flex;
    flex-direction: column;
  }
  .modal-dialog-header {
    height: 48px;
    background: var(--surface-alt);
    border-bottom: 2px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 18px;
  }
  .modal-dialog-body {
    padding: 20px;
    overflow: auto;
    background: #6E7781;
  }
  .modal-dialog-body.plain { background: var(--surface); }
  .modal-dialog-footer {
    height: 52px;
    background: var(--bg);
    border-top: 2px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 18px;
    gap: 10px;
  }

  /* Printable Report Page Simulation (A4) */
  .report-page {
    width: 210mm;
    min-height: 297mm;
    background: #FFFFFF;
    color: #141719;
    margin: 0 auto;
    padding: 14mm 14mm 14mm 14mm;
    box-shadow: 0 6px 24px rgba(0, 0, 0, .25);
    display: flex;
    flex-direction: column;
    font-family: "Segoe UI", Arial, sans-serif;
  }

  /* Letterhead Classic */
  .letterhead-classic {
    background: #F0F6FC;
    border: 1px solid #CCDDF0;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 18px;
    margin-bottom: 16px;
  }
  .lh-logo {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .lh-title-block { flex: 1; }
  .lh-pre { color: #0080B8; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
  .lh-main { color: #0E4D92; font-size: 26px; font-weight: 900; line-height: 1.1; margin: 2px 0; }
  .lh-sub-badge {
    display: inline-block;
    background: #0E4D92;
    color: #FFFFFF;
    font-size: 9.5px;
    font-weight: 800;
    padding: 2px 8px;
    text-transform: uppercase;
    letter-spacing: .08em;
  }
  .lh-tagline { color: #0080B8; font-size: 8.5px; font-weight: 800; letter-spacing: 1.5px; margin-left: 8px; }
  .lh-contact {
    text-align: right;
    font-size: 10px;
    color: #4A5157;
    line-height: 1.4;
    border-left: 1px solid #A9C7E8;
    padding-left: 14px;
  }

  /* Letterhead Modern */
  .letterhead-modern {
    background: #0A3668;
    color: #FFFFFF;
    padding: 12px 18px;
    display: flex;
    align-items: center;
    gap: 18px;
    margin-bottom: 16px;
    border-bottom: 3px solid #0080B8;
  }
  .letterhead-modern .lh-main { color: #FFFFFF; }
  .letterhead-modern .lh-pre { color: #48CAE4; }
  .letterhead-modern .lh-contact { color: #D4E7FA; border-left-color: #1E5C9A; }

  /* Letterhead Preprinted (Blank top margin) */
  .letterhead-preprinted {
    height: 36mm;
    margin-bottom: 8mm;
  }

  /* Metadata Table */
  .meta-grid {
    display: grid;
    grid-template-columns: 1fr 1.3fr 1fr;
    gap: 6px 14px;
    font-size: 11px;
    padding-bottom: 10px;
    border-bottom: 2px solid #141719;
    margin-bottom: 14px;
  }
  .meta-row { display: flex; gap: 6px; }
  .meta-k { font-weight: 700; width: 110px; color: #4A5157; }
  .meta-v { font-weight: 700; color: #141719; flex: 1; }

  /* Clinical Note Box */
  .clinical-box {
    background: #F0F6FC;
    border: 1px solid #CCDDF0;
    border-left: 4px solid #0E4D92;
    padding: 10px 14px;
    font-size: 10px;
    line-height: 1.45;
    color: #141719;
    margin-top: 14px;
    text-align: justify;
  }

  /* Signatures */
  .sign-row {
    margin-top: auto;
    padding-top: 24px;
    display: flex;
    justify-content: space-between;
    text-align: center;
    font-size: 10.5px;
  }
  .sign-person { width: 180px; }
  .sign-name { font-weight: 800; color: #141719; }
  .sign-qual { font-size: 9.5px; color: #4A5157; }
  .sign-role { font-size: 10px; color: #0E4D92; font-weight: 700; }

  /* Disclaimer Strip */
  .disclaimer-strip {
    margin-top: 14px;
    background: #0E4D92;
    color: #FFFFFF;
    font-size: 8px;
    line-height: 1.35;
    padding: 6px 10px;
    text-align: center;
  }

  /* POS Receipt */
  .pos-receipt {
    width: 80mm;
    background: #FFF;
    color: #000;
    padding: 10mm 6mm;
    margin: 0 auto;
    font-family: monospace;
    font-size: 12px;
    line-height: 1.4;
    box-shadow: 0 4px 16px rgba(0,0,0,.2);
  }

  /* Login Card */
  .login-box {
    max-width: 420px;
    margin: 60px auto;
    background: var(--surface);
    border: 2px solid var(--border);
    padding: 32px;
    text-align: center;
  }
  .pin-key-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    max-width: 220px;
    margin: 16px auto 0;
  }
  .pin-key-btn {
    height: 48px;
    font-size: 20px;
    font-weight: 800;
    background: var(--surface-alt);
    border: 1px solid var(--border-light);
  }
  .pin-key-btn:hover { background: var(--border-light); }

  @media print {
    body { background: #FFF !important; color: #000 !important; }
    .top-header, .nav-tabs-bar, .bottom-statusbar, .workspace-main, .modal-dialog-header, .modal-dialog-footer { display: none !important; }
    .modal-overlay { position: static !important; background: none !important; padding: 0 !important; display: block !important; }
    .modal-dialog-box { box-shadow: none !important; border: none !important; max-width: none !important; }
    .modal-dialog-body { background: none !important; padding: 0 !important; }
    .report-page { box-shadow: none !important; margin: 0 !important; width: 100% !important; padding: 10mm !important; page-break-after: always; }
  }
</style>
</head>
<body>

<div class="app-container" id="app-root">
  <!-- Dynamic Screen Content Rendered via JS -->
</div>

<!-- Modal Container -->
<div class="modal-overlay" id="modal-container" onclick="if(event.target===this)closeModal()">
  <div class="modal-dialog-box">
    <div class="modal-dialog-header">
      <h2 id="modal-dialog-title" style="font-size:15px; font-weight:800; letter-spacing:-.01em;">Dialog</h2>
      <button class="btn-m" style="margin-left:auto; border:none; background:none; font-size:16px;" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-dialog-body" id="modal-dialog-body"></div>
    <div class="modal-dialog-footer" id="modal-dialog-footer"></div>
  </div>
</div>

<script>
/* ==========================================================================

   ========================================================================== */

const AUTHOR = "RANDOM_GTV";
const APP_VERSION = "2026.1 (Modernist Release)";

/* Full Pathology Catalog */
const TESTS = {
  // Bio-chemistry

  HB:{n:"Haemoglobin",m:"Cyanmethemoglobin",g:"HAEMATOLOGY",u:"g/dl",d:1,lo:12,hi:15,r:"12 - 15 g/dl",bySex:{M:{lo:13,hi:17,r:"13 - 17 g/dl"},F:{lo:12,hi:15,r:"12 - 15 g/dl"}},rate:80},

let authMode = "signin"; // "signin" | "signup"
let selectedStaffUsername = STAFF_ACCOUNTS[1]?.username || "saheed";

function setAuthMode(mode) {
  authMode = mode;
  render();
}

function onSelectUser(uname) {
  selectedStaffUsername = uname;
}

function handleSignInSubmit() {
  const pinInput = document.getElementById("auth-pin-input");
  const pin = pinInput ? pinInput.value.trim() : "";
  const user = STAFF_ACCOUNTS.find(u => u.username === selectedStaffUsername) || STAFF_ACCOUNTS[0];

  if (!pin) {
    alert("Please enter your 4-digit PIN.");
    return;
  }

  // Check pin against selected user or default admin PIN 1598
  if (user && (user.pin === pin || pin === "1598")) {
    currentUser = user;
    sessionStorage.setItem("labsoft_user_v2", JSON.stringify(user));
    render();
  } else {
    alert("Incorrect PIN. Default PIN is 1598.");
    if (pinInput) pinInput.value = "";
  }
}

function handleSignUpSubmit() {
  const name = document.getElementById("su-name")?.value.trim();
  const username = document.getElementById("su-username")?.value.trim().toLowerCase();
  const role = document.getElementById("su-role")?.value || "Reception";
  const pin = document.getElementById("su-pin")?.value.trim();
  const pinConfirm = document.getElementById("su-pin-confirm")?.value.trim();

  if (!name || !username || !pin) {
    alert("Please fill in Name, Username, and a 4-digit PIN.");
    return;
  }
  if (pin.length < 4) {
    alert("PIN must be at least 4 digits.");
    return;
  }
  if (pin !== pinConfirm) {
    alert("PIN and Confirm PIN do not match.");
    return;
  }
  if (STAFF_ACCOUNTS.some(u => u.username === username)) {
    alert("Username already exists. Please choose a different username.");
    return;
  }

  const newUser = { username, name, role, pin };
  STAFF_ACCOUNTS.push(newUser);
  saveState();

  currentUser = newUser;
  sessionStorage.setItem("labsoft_user_v2", JSON.stringify(newUser));
  alert(`Login created for ${name} (${role}). Welcome to LabSoft!`);
  render();
}

function signOut() {
  currentUser = null;
  sessionStorage.removeItem("labsoft_user_v2");
  authMode = "signin";
  render();
}

function getCurrentSignDateStr() {
  const now = new Date();
  const days = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  const dayName = days[now.getDay()];
  const dateStr = now.toLocaleDateString("en-GB").replace(/\//g, "-");
  const timeStr = now.toLocaleTimeString("en-US", { hour: "2-digit", minute: "2-digit", hour12: false });
  return `${dayName} ${dateStr} · ${timeStr}`;
}

function updateJobNotes() {
  const box = document.getElementById("job-dynamic-notes");
  if (!box) return;
  let missing = [];
  if (!activeJob.name.trim()) missing.push("patient name");
  if (!activeJob.mobile.trim()) missing.push("mobile number");
  if (!activeJob.sex.trim()) missing.push("sex");

  if (missing.length) {
    box.innerHTML = `
      <div style="color:var(--text-muted);">Prints as: <b>${activeJob.name || '…'} .${activeJob.initial}.</b></div>
      <div style="color:var(--accent-amber); font-weight:700;">Still needed: ${missing.join(", ")}</div>
    `;
  } else {
    box.innerHTML = `
      <div style="color:var(--text-muted);">Prints as: <b>${activeJob.name} .${activeJob.initial}.</b></div>
      <div style="color:var(--accent-green); font-weight:700;">✓ Patient details complete</div>
    `;
  }
}

function onResultInput(code, val) {
  activeJob.results[code] = val;
  // Recalculate derived formulas
  if (code === "HBA1C" && !isNaN(val) && val) {
    const h = parseFloat(val);
    const eag = Math.round(28.7 * h - 46.7);
    activeJob.results["EAG"] = String(eag);
  }
  if (code === "UREA" && !isNaN(val) && val) {
    activeJob.results["BUN"] = (parseFloat(val) / 2.14).toFixed(1);
  }
  if ((code === "CHOL" || code === "HDL" || code === "TG") && activeJob.tests.includes("LDL")) {
    const c = parseFloat(activeJob.results["CHOL"] || 0);
    const h = parseFloat(activeJob.results["HDL"] || 0);
    const tg = parseFloat(activeJob.results["TG"] || 0);
    if (c && h && tg) {
      activeJob.results["LDL"] = String(Math.round(c - h - tg / 5));
      activeJob.results["VLDL"] = String(Math.round(tg / 5));
      activeJob.results["CHOLHDL"] = (c / h).toFixed(2);
    }
  }
  if ((code === "TBIL" || code === "DBIL") && activeJob.tests.includes("IBIL")) {
    const tb = parseFloat(activeJob.results["TBIL"] || 0);
    const db = parseFloat(activeJob.results["DBIL"] || 0);
    if (tb && db) activeJob.results["IBIL"] = (tb - db).toFixed(2);
  }
  if ((code === "TP" || code === "ALB") && activeJob.tests.includes("GLOB")) {
    const tp = parseFloat(activeJob.results["TP"] || 0);
    const alb = parseFloat(activeJob.results["ALB"] || 0);
    if (tp && alb) {
      activeJob.results["GLOB"] = (tp - alb).toFixed(1);
      activeJob.results["AGR"] = (alb / (tp - alb)).toFixed(2);
    }
  }
  render();
}

function addPanel(name) {
  const list = PANELS[name] || [];
  list.forEach(code => {
    if (!activeJob.tests.includes(code)) activeJob.tests.push(code);
  });
  render();
}

function removeTest(code) {
  activeJob.tests = activeJob.tests.filter(c => c !== code);
  delete activeJob.results[code];
  render();
}

function searchTestQuick(term) {
  term = term.trim().toUpperCase();
  const box = document.getElementById("search-quick-res");
  if (!term || term.length < 2) { box.innerHTML = ""; return; }
  const matches = Object.keys(TESTS).filter(k => k.includes(term) || TESTS[k].n.toUpperCase().includes(term));
  box.innerHTML = matches.slice(0, 8).map(k => `
    <button class="panel-tag-btn" onclick="if(!activeJob.tests.includes('${k}')){activeJob.tests.push('${k}'); render();}">+ ${TESTS[k].n}</button>
  `).join("");
}

function searchPatientAutocomplete(query) {
  const box = document.getElementById("patient-hits");
  if (!box) return;
  query = query.trim().toLowerCase();
  if (query.length < 2) { box.innerHTML = ""; return; }
  const matches = jobs.filter(j => j.name.toLowerCase().includes(query) || j.mobile.includes(query));
  if (!matches.length) { box.innerHTML = ""; return; }
  box.innerHTML = `
    <div style="position:absolute; top:4px; left:0; right:0; background:var(--surface); border:2px solid var(--border); box-shadow:0 8px 24px rgba(0,0,0,.2); max-height:160px; overflow:auto;">
      ${matches.map(m => `
        <div style="padding:8px 12px; border-bottom:1px solid var(--border-subtle); cursor:pointer;" onclick="fillPatientFromPrev('${m.id}')">
          <b>${m.name} .${m.initial}.</b> &nbsp;·&nbsp; <span style="color:var(--text-muted);">${m.mobile}</span> &nbsp;·&nbsp; ${m.sex} (${m.age} ${m.age_unit})
        </div>
      `).join("")}
    </div>
  `;
}

function fillPatientFromPrev(id) {
  const p = jobs.find(j => String(j.id) === String(id));
  if (p) {
    activeJob.name = p.name;
    activeJob.initial = p.initial;
    activeJob.mobile = p.mobile;
    activeJob.sex = p.sex;
    activeJob.age = p.age;
    activeJob.age_unit = p.age_unit;
    activeJob.referrer = p.referrer;
    render();
  }
}

function newJob() {
  activeJob = createEmptyJob();
  render();
}

function saveJobLocal() {
  if (!activeJob.name.trim()) {
    alert("Please enter patient name.");
    return;
  }
  let idx = jobs.findIndex(j => j.id === activeJob.id);
  if (idx >= 0) jobs[idx] = JSON.parse(JSON.stringify(activeJob));
  else jobs.push(JSON.parse(JSON.stringify(activeJob)));
  saveState();
  alert("Job #" + activeJob.report_no + " saved successfully!");
}

function verifyAndCompleteJob() {
  if (!activeJob.name.trim() || !activeJob.mobile.trim() || !activeJob.sex.trim()) {
    alert("Name, Mobile and Sex are required to produce the clinical report.");
    return;
  }
  activeJob.status = "ready";
  saveJobLocal();
  openReportPreview(activeJob);
}

function filterQueueLive(query) {
  query = query.toLowerCase();
  const rows = document.querySelectorAll("#queue-table tbody tr");
  rows.forEach(r => {
    r.style.display = r.textContent.toLowerCase().includes(query) ? "" : "none";
  });
}

function saveNewDoctor() {
  const name = document.getElementById("nd-name").value.trim();

  DOCTORS.push({

    hosp: document.getElementById("nd-hosp").value.trim() || "Local Clinic",
    phone: document.getElementById("nd-phone").value.trim(),
    pct: parseInt(document.getElementById("nd-pct").value) || 10

  render();
}

function exportSummaryCSV() {

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LabSoft — New Mithra Medical Laboratory (by RANDOM_GTV)</title>
<style>
  :root {
    --brand: #0E4D92;
    --brand-dark: #0A3668;
    --brand-accent: #0080B8;
    --brand-cyan: #00A3E0;
    --brand-soft: #F0F6FC;
    --brand-edge: #CCDDF0;
    --brand-div: #A9C7E8;
    --red: #C1121F;
    --green: #16703F;
    --amber: #8A5A00;
    --blue: #0E4D92;
    --ink: #141719;
    --ink2: #4A5157;
    --ink3: #616A72;
    --line: #C3CBD2;
    --line2: #EDF0F3;
    --bg: #F4F6F8;
    --panel: #FFFFFF;
  }

  body.dark {
    --brand: #48CAE4;
    --brand-dark: #0080B8;
    --brand-accent: #00A3E0;
    --brand-cyan: #48CAE4;
    --brand-soft: #102438;
    --brand-edge: #1C3E60;
    --brand-div: #2C5680;
    --red: #FF8A8A;
    --green: #6FD79B;
    --amber: #F0C066;
    --blue: #8AB6F5;
    --ink: #EEF2F5;
    --ink2: #C3CBD2;
    --ink3: #A6B0B9;
    --line: #2F3D48;
    --line2: #1E2830;
    --bg: #10161B;
    --panel: #172027;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 14px/1.5 "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, Arial, sans-serif;
  }

  button, input, select, textarea { font: inherit; color: var(--ink); }
  button { cursor: pointer; }

  .app {
    max-width: 1400px;
    margin: 0 auto;
    min-height: 100%;
    display: flex;
    flex-direction: column;
  }

  /* Titlebar */
  .titlebar {
    background: #072242;
    color: #E8EAED;
    padding: 8px 18px;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 2px solid var(--brand-accent);
  }
  .titlebar .dot { width: 10px; height: 10px; border-radius: 50%; background: #00A3E0; }
  .titlebar b { color: #FFFFFF; font-weight: 700; }
  .titlebar .author-badge {
    background: #0E4D92;
    color: #48CAE4;
    font-weight: 700;
    font-size: 11px;
    letter-spacing: .06em;
    padding: 3px 10px;
    border-radius: 14px;
    border: 1px solid #1E5C9A;
    cursor: pointer;
  }
  .titlebar .author-badge:hover { background: #0A3668; color: #FFF; }
  .titlebar .online-test-tag {
    margin-left: auto;
    background: #16703F;
    color: #FFF;
    font-weight: 700;
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 14px;
  }

  /* Navigation Tabs */
  .tabs {
    display: flex;
    gap: 2px;
    padding: 8px 14px 0;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
  }
  .tab {
    padding: 10px 20px;
    border: 1px solid transparent;
    border-bottom: 0;
    border-radius: 6px 6px 0 0;
    color: var(--ink2);
    font-weight: 600;
    background: none;
    transition: all .15s ease;
  }
  .tab.on {
    background: var(--panel);
    border-color: var(--line);
    color: var(--brand);
    margin-bottom: -1px;
    padding-bottom: 11px;
    font-weight: 700;
  }
  .tab:hover:not(.on) { background: var(--line2); }

  main {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--line);
    border-top: 0;
    margin: 0 14px;
    border-radius: 0 0 8px 8px;
    padding: 18px 20px 14px;
    overflow: auto;
  }

  .statusbar {
    display: flex;
    gap: 20px;
    padding: 8px 22px;
    color: var(--ink3);
    font-size: 12px;
    background: var(--bg);
    align-items: center;
  }
  .statusbar b { color: var(--ink); }
  .statusbar .right { margin-left: auto; display: flex; gap: 14px; align-items: center; }
  .statusbar a { color: var(--brand); text-decoration: none; font-weight: 600; cursor: pointer; }
  .statusbar a:hover { text-decoration: underline; }

  /* Fieldsets & Forms */
  fieldset {
    border: 1px solid var(--line);
    border-radius: 7px;
    margin: 0 0 14px;
    padding: 14px 16px 12px;
    background: var(--panel);
  }
  legend {
    color: var(--brand);
    font-weight: 700;
    font-size: 12px;
    padding: 0 6px;
    text-transform: uppercase;
    letter-spacing: .04em;
  }
  label.f {
    display: block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .05em;
    text-transform: uppercase;
    color: var(--ink3);
    margin-bottom: 5px;
  }
  .req-star { color: #E5484D; font-weight: bold; font-size: 13px; }

  input[type=text], input[type=number], input[type=password], select, textarea {
    background: var(--panel);
    border: 1px solid #88929B;
    border-radius: 5px;
    padding: 7px 10px;
    width: 100%;
    color: var(--ink);
  }
  input:focus, select:focus, textarea:focus {
    outline: 0;
    border: 2px solid var(--brand);
    padding: 6px 9px;
  }
  input[readonly] { background: var(--line2); color: var(--ink2); border-style: dashed; }

  /* Buttons */
  .btn {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 8px 16px;
    font-weight: 600;
    color: var(--ink);
    transition: all .15s ease;
  }
  .btn:hover { background: var(--line2); }
  .btn:disabled { background: var(--line2); color: var(--ink3); cursor: not-allowed; opacity: .6; }
  .btn.p { background: var(--brand); border-color: var(--brand); color: #FFFFFF; }
  .btn.p:hover { background: var(--brand-dark); }
  .btn.go { background: var(--green); border-color: var(--green); color: #FFFFFF; font-weight: 700; }
  .btn.go:hover { background: #115932; }
  .btn.q { background: none; border-color: transparent; color: var(--brand); padding: 6px 10px; }
  .btn.q:hover { background: var(--brand-soft); }
  .btn.panel {
    background: var(--brand-soft);
    border: 1px solid var(--brand-edge);
    color: var(--brand-dark);
    padding: 8px 13px;
    font-size: 13px;
    border-radius: 6px;
    font-weight: 600;
  }
  body.dark .btn.panel { color: var(--brand); }
  .btn.panel:hover { background: var(--brand-edge); }

  .flexr { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .rowg { display: grid; gap: 12px; }

  /* Tables */
  table { width: 100%; border-collapse: collapse; }
  th {
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--ink3);
    text-align: left;
    padding: 10px 12px;
    border-bottom: 1px solid var(--line);
    background: var(--brand-soft);
    font-weight: 700;
  }
  td { padding: 10px 12px; border-bottom: 1px solid var(--line2); font-size: 13.5px; }
  tbody tr:hover { background: var(--brand-soft); cursor: pointer; }
  tbody tr.sel { background: var(--brand-soft); font-weight: 600; }

  /* Flags */
  .flag { font-weight: 800; font-size: 11px; padding: 3px 8px; border-radius: 4px; display: inline-block; min-width: 50px; text-align: center; }
  .f-H { background: #FDECEB; color: var(--red); border: 1px solid #F8B4B4; }
  .f-L { background: #EAF1FC; color: var(--blue); border: 1px solid #B6D2FB; }
  .f-N { background: #EAF5EE; color: var(--green); border: 1px solid #B0E2C2; }

  /* Status Pills */
  .pill { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px; text-transform: uppercase; }
  .p-draft { background: var(--line2); color: var(--ink2); }
  .p-prog { background: #FDF5E3; color: var(--amber); }
  .p-ready { background: #EAF5EE; color: var(--green); }
  .p-sent { background: var(--brand-soft); color: var(--brand); }

  /* Results Grid */
  .results-grid {
    display: grid;
    grid-template-columns: minmax(260px, 1.4fr) 140px 75px 190px 80px 40px;
    gap: 6px 14px;
    align-items: center;
  }
  .results-grid .gh {
    grid-column: 1 / -1;
    color: var(--brand);
    font-weight: 800;
    font-size: 12px;
    letter-spacing: .06em;
    text-transform: uppercase;
    padding: 14px 0 4px;
    border-bottom: 1px solid var(--brand-div);
  }
  .results-grid .nm { font-size: 13.5px; font-weight: 500; }
  .results-grid .nm.calc { font-style: italic; color: var(--ink2); }
  .results-grid .unit, .results-grid .rng { color: var(--ink3); font-size: 12.5px; }

  /* Modal */
  .modal {
    position: fixed;
    inset: 0;
    background: rgba(10, 25, 45, .7);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
  }
  .modal.show { display: flex; }
  .sheet {
    background: var(--panel);
    border-radius: 10px;
    max-width: 980px;
    width: 100%;
    max-height: 94vh;
    display: flex;
    flex-direction: column;
    box-shadow: 0 24px 64px rgba(0, 0, 0, .4);
    border: 1px solid var(--line);
  }
  .sheet header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--brand-soft);
    border-radius: 10px 10px 0 0;
  }
  .sheet header h2 { margin: 0; font-size: 16px; color: var(--brand-dark); }
  body.dark .sheet header h2 { color: var(--brand); }
  .sheet .body {
    padding: 20px;
    overflow: auto;
    background: #6E7781;
  }
  .sheet .body.plain { background: var(--panel); }
  .sheet footer {
    padding: 14px 20px;
    border-top: 1px solid var(--line);
    display: flex;
    gap: 10px;
    align-items: center;
    background: var(--bg);
    border-radius: 0 0 10px 10px;
  }

  /* Login Screen Card */
  .login-card {
    max-width: 440px;
    margin: 40px auto;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 28px;
    box-shadow: 0 12px 36px rgba(0, 0, 0, .15);
    text-align: center;
  }
  .pin-pad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    max-width: 240px;
    margin: 16px auto 0;
  }
  .pin-btn {
    padding: 14px;
    font-size: 18px;
    font-weight: 700;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--brand-soft);
    color: var(--brand-dark);
  }
  .pin-btn:hover { background: var(--brand-edge); }

  /* Printable Report Page Simulation (A4) */
  .report-page {
    width: 210mm;
    min-height: 297mm;
    background: #FFFFFF;
    color: #141719;
    margin: 0 auto;
    padding: 14mm 14mm 14mm 14mm;
    box-shadow: 0 6px 24px rgba(0, 0, 0, .25);
    display: flex;
    flex-direction: column;
    font-family: "Segoe UI", Arial, sans-serif;
  }

  /* Letterhead Classic */
  .letterhead-classic {
    background: #F0F6FC;
    border: 1px solid #CCDDF0;
    border-radius: 4px;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 18px;
    margin-bottom: 16px;
  }
  .lh-logo {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    flex-shrink: 0;
    box-shadow: 0 2px 6px rgba(0, 0, 0, .15);
  }
  .lh-title-block { flex: 1; }
  .lh-pre { color: #0080B8; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
  .lh-main { color: #0E4D92; font-size: 26px; font-weight: 900; line-height: 1.1; margin: 2px 0; }
  .lh-sub-badge {
    display: inline-block;
    background: #0E4D92;
    color: #FFFFFF;
    font-size: 9.5px;
    font-weight: 800;
    padding: 2px 8px;
    border-radius: 12px;
    text-transform: uppercase;
    letter-spacing: .08em;
  }
  .lh-tagline { color: #0080B8; font-size: 8.5px; font-weight: 800; letter-spacing: 1.5px; margin-left: 8px; }
  .lh-contact {
    text-align: right;
    font-size: 10px;
    color: #4A5157;
    line-height: 1.4;
    border-left: 1px solid #A9C7E8;
    padding-left: 14px;
  }

  /* Letterhead Modern */
  .letterhead-modern {
    background: #0A3668;
    color: #FFFFFF;
    padding: 12px 18px;
    display: flex;
    align-items: center;
    gap: 18px;
    margin-bottom: 16px;
    border-bottom: 3px solid #0080B8;
  }
  .letterhead-modern .lh-main { color: #FFFFFF; }
  .letterhead-modern .lh-pre { color: #48CAE4; }
  .letterhead-modern .lh-contact { color: #D4E7FA; border-left-color: #1E5C9A; }

  /* Metadata Table */
  .meta-grid {
    display: grid;
    grid-template-columns: 1fr 1.3fr 1fr;
    gap: 6px 14px;
    font-size: 11px;
    padding-bottom: 10px;
    border-bottom: 2px solid #141719;
    margin-bottom: 14px;
  }
  .meta-row { display: flex; gap: 6px; }
  .meta-k { font-weight: 700; width: 110px; color: #4A5157; }
  .meta-v { font-weight: 700; color: #141719; flex: 1; }

  /* Clinical Note Box */
  .clinical-box {
    background: #F0F6FC;
    border: 1px solid #CCDDF0;
    border-left: 4px solid #0E4D92;
    border-radius: 4px;
    padding: 10px 14px;
    font-size: 10px;
    line-height: 1.45;
    color: #141719;
    margin-top: 14px;
    text-align: justify;
  }

  /* Signatures */
  .sign-row {
    margin-top: auto;
    padding-top: 24px;
    display: flex;
    justify-content: space-between;
    text-align: center;
    font-size: 10.5px;
  }
  .sign-person { width: 180px; }
  .sign-name { font-weight: 800; color: #141719; }
  .sign-qual { font-size: 9.5px; color: #4A5157; }
  .sign-role { font-size: 10px; color: #0E4D92; font-weight: 700; }

  /* Disclaimer Strip */
  .disclaimer-strip {
    margin-top: 14px;
    background: #0E4D92;
    color: #FFFFFF;
    font-size: 8px;
    line-height: 1.35;
    padding: 6px 10px;
    text-align: center;
    border-radius: 2px;
  }

  @media print {
    body { background: #FFF !important; color: #000 !important; }
    .titlebar, .tabs, .statusbar, main, .sheet header, .sheet footer { display: none !important; }
    .modal { position: static !important; background: none !important; padding: 0 !important; display: block !important; }
    .sheet { box-shadow: none !important; border: none !important; max-width: none !important; }
    .sheet .body { background: none !important; padding: 0 !important; }
    .report-page { box-shadow: none !important; margin: 0 !important; width: 100% !important; padding: 10mm !important; page-break-after: always; }
  }
</style>
</head>
<body>

<div class="app" id="app-root">
  <!-- Dynamic App / Login Layout -->
</div>

<!-- Modal Dialog (For Report Preview, Billing Receipt, About Dialog) -->
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="sheet" id="modal-sheet">
    <header>
      <h2 id="modal-title">Dialog</h2>
      <button class="btn q" style="margin-left:auto" onclick="closeModal()">✕ Close</button>
    </header>
    <div class="body" id="modal-body"></div>
    <footer id="modal-footer">
      <button class="btn" onclick="closeModal()">Close</button>
    </footer>
  </div>
</div>

<script>
/* ==========================================================================
   LabSoft Full Web App Engine — by RANDOM_GTV (100% Full Feature Edition)
   ========================================================================== */

const AUTHOR = "RANDOM_GTV";
const APP_VERSION = "1.0.0 (Production Release)";

/* Full 50+ Tests Catalog */
const TESTS = {
  // Bio-chemistry
  GLU_F:{n:"Blood Glucose [Fasting]",g:"BIO-CHEMISTRY (Routine)",u:"mg/dl",d:0,lo:70,hi:110,r:"70 - 110 mg/dl",rate:60},
  GLU_PP:{n:"Blood Glucose [P P 2 hrs]",g:"BIO-CHEMISTRY (Routine)",u:"mg/dl",d:0,lo:70,hi:140,r:"70 - 140 mg/dl",rate:60},
  HBA1C:{n:"HbA1c (Glycated Haemoglobin)",g:"BIO-CHEMISTRY (Routine)",u:"%",d:1,hi:5.7,r:"< 5.7%",rate:350},
  EAG:{n:"Mean Blood Glucose",g:"BIO-CHEMISTRY (Routine)",u:"mg/dl",d:0,hi:117,r:"< 117mg/dl",f:"28.7 * HBA1C - 46.7",rate:100},
  UREA:{n:"Blood Urea",g:"RENAL FUNCTION TEST",u:"mg/dl",d:0,lo:15,hi:45,r:"15 - 45 mg/dl",rate:90},
  CREAT:{n:"Serum Creatinine",g:"RENAL FUNCTION TEST",u:"mg/dl",d:2,lo:0.6,hi:1.3,r:"0.6 - 1.3 mg/dl",rate:90},
  URIC:{n:"Serum Uric Acid",g:"RENAL FUNCTION TEST",u:"mg/dl",d:1,lo:3.5,hi:7.2,r:"3.5 - 7.2 mg/dl",rate:100},

  // Haematology
  HB:{n:"Haemoglobin",g:"HAEMATOLOGY",u:"g/dl",d:1,lo:12,hi:15,r:"12 - 15 g/dl",bySex:{M:{lo:13,hi:17,r:"13 - 17 g/dl"},F:{lo:12,hi:15,r:"12 - 15 g/dl"}},rate:80},
  TC:{n:"Total WBC Count",g:"HAEMATOLOGY",u:"cells/cumm",d:0,lo:4000,hi:11000,r:"4,000 - 11,000",rate:90},
  PLT:{n:"Platelet Count",g:"HAEMATOLOGY",u:"lakhs/cumm",d:2,lo:1.5,hi:4.5,r:"1.5 - 4.5 lakhs/cumm",rate:90},
  PCV:{n:"PCV / Haematocrit",g:"HAEMATOLOGY",u:"%",d:1,lo:36,hi:46,r:"36 - 46%",rate:80},
  ESR:{n:"ESR (Westergren)",g:"HAEMATOLOGY",u:"mm/hr",d:0,hi:20,r:"0 - 20 mm/hr",rate:60},
  NEU:{n:"Neutrophils",g:"HAEMATOLOGY",u:"%",d:0,lo:40,hi:75,r:"40 - 75%",rate:60},
  LYM:{n:"Lymphocytes",g:"HAEMATOLOGY",u:"%",d:0,lo:20,hi:45,r:"20 - 45%",rate:60},
  EOS:{n:"Eosinophils",g:"HAEMATOLOGY",u:"%",d:0,lo:1,hi:6,r:"1 - 6%",rate:60},
  MONO:{n:"Monocytes",g:"HAEMATOLOGY",u:"%",d:0,lo:2,hi:8,r:"2 - 8%",rate:60},

  // Liver Function
  TBIL:{n:"Total Bilirubin",g:"LIVER FUNCTION TEST",u:"mg/dl",d:2,lo:0.2,hi:1.2,r:"0.2 - 1.2 mg/dl",rate:100},
  DBIL:{n:"Direct Bilirubin",g:"LIVER FUNCTION TEST",u:"mg/dl",d:2,hi:0.3,r:"< 0.3 mg/dl",rate:100},
  IBIL:{n:"Indirect Bilirubin",g:"LIVER FUNCTION TEST",u:"mg/dl",d:2,lo:0.2,hi:0.9,r:"0.2 - 0.9 mg/dl",f:"TBIL - DBIL",rate:60},
  SGPT:{n:"SGPT (ALT)",g:"LIVER FUNCTION TEST",u:"U/L",d:0,hi:34,r:"< 34 U/L",rate:110},
  SGOT:{n:"SGOT (AST)",g:"LIVER FUNCTION TEST",u:"U/L",d:0,hi:32,r:"< 32 U/L",rate:110},
  ALP:{n:"Alkaline Phosphatase (ALP)",g:"LIVER FUNCTION TEST",u:"U/L",d:0,lo:30,hi:120,r:"30 - 120 U/L",rate:120},
  TP:{n:"Total Protein",g:"LIVER FUNCTION TEST",u:"g/dl",d:1,lo:6.0,hi:8.3,r:"6.0 - 8.3 g/dl",rate:100},
  ALB:{n:"Albumin",g:"LIVER FUNCTION TEST",u:"g/dl",d:1,lo:3.5,hi:5.2,r:"3.5 - 5.2 g/dl",rate:100},
  GLOB:{n:"Globulin",g:"LIVER FUNCTION TEST",u:"g/dl",d:1,lo:2.0,hi:3.5,r:"2.0 - 3.5 g/dl",f:"TP - ALB",rate:60},
  AGR:{n:"A / G Ratio",g:"LIVER FUNCTION TEST",u:"",d:2,lo:1.0,hi:2.1,r:"1.0 - 2.1",f:"ALB / GLOB",rate:60},

  // Lipid Profile
  CHOL:{n:"Total Cholesterol",g:"LIPID PROFILE",u:"mg/dl",d:0,hi:200,r:"< 200 mg/dl",rate:120},
  TG:{n:"Triglycerides",g:"LIPID PROFILE",u:"mg/dl",d:0,hi:150,r:"< 150 mg/dl",rate:140},
  HDL:{n:"HDL Cholesterol",g:"LIPID PROFILE",u:"mg/dl",d:0,lo:40,hi:60,r:"40 - 60 mg/dl",rate:140},
  LDL:{n:"LDL Cholesterol",g:"LIPID PROFILE",u:"mg/dl",d:0,hi:100,r:"< 100 mg/dl",f:"CHOL - HDL - TG/5",rate:140},
  VLDL:{n:"VLDL Cholesterol",g:"LIPID PROFILE",u:"mg/dl",d:0,lo:5,hi:40,r:"5 - 40 mg/dl",f:"TG / 5",rate:60},
  CHR:{n:"Total Cholesterol / HDL Ratio",g:"LIPID PROFILE",u:"",d:2,hi:4.5,r:"< 4.5",f:"CHOL / HDL",rate:60},

  // Thyroid Profile
  T3:{n:"Total T3",g:"THYROID PROFILE",u:"ng/dl",d:0,lo:80,hi:200,r:"80 - 200 ng/dl",rate:180},
  T4:{n:"Total T4",g:"THYROID PROFILE",u:"µg/dl",d:1,lo:5.1,hi:14.1,r:"5.1 - 14.1 µg/dl",rate:180},
  TSH:{n:"TSH (Ultrasensitive)",g:"THYROID PROFILE",u:"µIU/ml",d:2,lo:0.27,hi:4.2,r:"0.27 - 4.2 µIU/ml",rate:250},

  // Electrolytes

let enteredPIN = "";

function loginWithPIN(pin) {
  const user = STAFF_ACCOUNTS.find(u => u.pin === pin);
  if (user) {
    currentUser = user;
    sessionStorage.setItem("labsoft_user", JSON.stringify(user));
    enteredPIN = "";
    render();
  } else {
    alert("Incorrect PIN. Default PIN is 1598.");
    enteredPIN = "";
    updatePinDisplay();
  }
}

function appendPIN(digit) {
  if (enteredPIN.length < 4) {
    enteredPIN += digit;
    updatePinDisplay();
    if (enteredPIN.length === 4) {
      setTimeout(() => loginWithPIN(enteredPIN), 150);
    }
  }
}

function clearPIN() {
  enteredPIN = "";
  updatePinDisplay();
}

function updatePinDisplay() {
  const el = document.getElementById("pin-display");
  if (el) {
    el.value = "● ".repeat(enteredPIN.length).trim();

}

function updateValidation() {
  const w = document.getElementById("val-warning");
  if (!w) return;
  let missing = [];
  if (!activeJob.name.trim()) missing.push("patient name");
  if (!activeJob.mobile.trim()) missing.push("mobile number");
  if (!activeJob.sex.trim()) missing.push("sex");
  if (missing.length) {
    w.textContent = "Still needed: " + missing.join(", ");
    w.style.color = "var(--amber)";
  } else {
    w.textContent = `Prints as: ${activeJob.name} .${activeJob.initial}. (Ready)`;
    w.style.color = "var(--green)";
  }
}

function onResultInput(code, val) {
  activeJob.results[code] = val;
  // Recalculate derived formulas
  if (code === "HBA1C" && !isNaN(val) && val) {
    const h = parseFloat(val);
    const eag = Math.round(28.7 * h - 46.7);
    activeJob.results["EAG"] = String(eag);
  }
  if ((code === "CHOL" || code === "HDL" || code === "TG") && activeJob.tests.includes("LDL")) {
    const c = parseFloat(activeJob.results["CHOL"] || 0);
    const h = parseFloat(activeJob.results["HDL"] || 0);
    const tg = parseFloat(activeJob.results["TG"] || 0);
    if (c && h && tg) {
      activeJob.results["LDL"] = String(Math.round(c - h - tg / 5));
      activeJob.results["VLDL"] = String(Math.round(tg / 5));
      activeJob.results["CHR"] = (c / h).toFixed(2);
    }
  }
  if ((code === "TBIL" || code === "DBIL") && activeJob.tests.includes("IBIL")) {
    const tb = parseFloat(activeJob.results["TBIL"] || 0);
    const db = parseFloat(activeJob.results["DBIL"] || 0);
    if (tb && db) activeJob.results["IBIL"] = (tb - db).toFixed(2);
  }
  if ((code === "TP" || code === "ALB") && activeJob.tests.includes("GLOB")) {
    const tp = parseFloat(activeJob.results["TP"] || 0);
    const alb = parseFloat(activeJob.results["ALB"] || 0);
    if (tp && alb) {
      activeJob.results["GLOB"] = (tp - alb).toFixed(1);
      activeJob.results["AGR"] = (alb / (tp - alb)).toFixed(2);
    }
  }
  render();
}

function addPanel(name) {
  const list = PANELS[name] || [];
  list.forEach(code => {
    if (!activeJob.tests.includes(code)) activeJob.tests.push(code);
  });
  render();
}

function removeTest(code) {
  activeJob.tests = activeJob.tests.filter(c => c !== code);
  delete activeJob.results[code];
  render();
}

function searchTestQuick(term) {
  term = term.trim().toUpperCase();
  const box = document.getElementById("search-quick-res");
  if (!term || term.length < 2) { box.innerHTML = ""; return; }
  const matches = Object.keys(TESTS).filter(k => k.includes(term) || TESTS[k].n.toUpperCase().includes(term));
  box.innerHTML = matches.slice(0, 8).map(k => `
    <button class="btn panel" onclick="if(!activeJob.tests.includes('${k}')){activeJob.tests.push('${k}'); render();}">+ ${TESTS[k].n}</button>
  `).join("");
}

function newJob() {
  activeJob = createEmptyJob();
  render();
}

function saveJobLocal() {
  if (!activeJob.name.trim()) {
    alert("Please enter patient name.");
    return;
  }
  let idx = jobs.findIndex(j => j.id === activeJob.id);
  if (idx >= 0) jobs[idx] = JSON.parse(JSON.stringify(activeJob));
  else jobs.push(JSON.parse(JSON.stringify(activeJob)));
  saveState();
  alert("Job #" + activeJob.report_no + " saved successfully!");
}

function verifyAndCompleteJob() {
  if (!activeJob.name.trim() || !activeJob.mobile.trim() || !activeJob.sex.trim()) {
    alert("Name, Mobile and Sex are required to produce the clinical report.");
    return;
  }
  activeJob.status = "ready";
  saveJobLocal();
  openReportPreview(activeJob);
}
